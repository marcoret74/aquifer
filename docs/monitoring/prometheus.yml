global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: aquifer
    metrics_path: /metrics/prometheus
    static_configs:
      # Docker Compose: el host se ve como host.docker.internal.
      # Prometheus nativo: cambiar por 127.0.0.1:8080.
      - targets: ["host.docker.internal:8080"]
        labels:
          service: aquifer

groups:
  - name: aquifer
    rules:
      - alert: AquiferDown
        expr: up{job="aquifer"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Aquifer no responde"
          description: "El exporter de Aquifer lleva más de 1 minuto caído."

      - alert: AquiferErrorRate
        expr: |
          sum(rate(aquifer_requests_total{status=~"4..|5.."}[5m]))
          /
          clamp_min(sum(rate(aquifer_requests_total[5m])), 1e-9) > 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tasa de error alta en Aquifer"
          description: "Más del 10% de las peticiones terminan en 4xx/5xx."

      - alert: AquiferLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(aquifer_request_latency_ms_bucket[5m]))) > 5000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Latencia p95 alta en Aquifer"
          description: "El p95 de latencia supera 5 s durante 10 minutos."

      - alert: AquiferTTFTP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(aquifer_ttft_ms_bucket[5m]))) > 2000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "TTFT p95 alto en Aquifer"
          description: "El p95 del primer token supera 2 s."

      - alert: AquiferSchemaFailures
        expr: sum(increase(aquifer_schema_failed_total[10m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Salidas estructuradas inválidas"
          description: "Hubo salidas JSON que no cumplieron el esquema."

      - alert: AquiferTimeouts
        expr: sum(increase(aquifer_timeouts_total[10m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Generaciones cortadas por timeout"
          description: "El watchdog cortó generaciones en los últimos 10 minutos."

      - alert: AquiferNoTraffic
        expr: sum(rate(aquifer_requests_total[10m])) == 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "Aquifer sin tráfico"
          description: "No se registran peticiones en los últimos 30 minutos."
